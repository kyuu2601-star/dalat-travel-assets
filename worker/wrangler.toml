name = "ai-test"
main = "src/index.js"
compatibility_date = "2026-09-29"
workers_dev = true
keep_vars = true

[ai]
binding = "AI"

[placement]
region = "gcp:us-central1"

[[d1_databases]]
binding = "DB"
database_name = "travelos"
database_id = "b8497615-d222-47b7-b5bd-7bb0efd17516"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "travelos-images"

[[services]]
binding = "MAP_WORKER"
service = "travelos-map"

[vars]
ALLOWED_ORIGINS = "https://kyuu2601-star.github.io,https://localhost,http://localhost,capacitor://localhost"
MAP_WORKER_URL = "https://travelos-map.kyuu2601.workers.dev"
SEMANTIC_PLANNER_ENABLED = "true"
SEMANTIC_PLANNER_MODE = "adaptive"
OPENAI_ENABLED = "false"
OPENAI_MODEL = "gpt-5.6-luna"
OPENAI_PLANNER_MODEL = "gpt-5.6-luna"
GEMINI_PLANNER_MODEL = "gemini-3.1-flash-lite"
GEMINI_PLANNER_FALLBACK_MODELS = "gemini-3.5-flash-lite,gemini-3.8-flash"
