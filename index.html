<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>TravelOS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ux-image.css">
    <link rel="stylesheet" href="place-manager.css">
    <link rel="stylesheet" href="nearby-search.css">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-top">
            <img src="logo.png" class="loading-logo" alt="TravelOS">
            <p id="loading-status" class="loading-status">Searching for GPS Satellites...</p>
        </div>
        <div class="scenery-layer"></div>
        <div class="road-layer"></div>
        <img src="bike.png" class="bike-layer" alt="Bike">
        <div class="loading-word" aria-label="Loading">
            <span class="char c1">L</span><span class="char c2">o</span><span class="char c3">a</span><span class="char c4">d</span><span class="char c5">i</span><span class="char c6">n</span><span class="char c7">g</span><span class="char c8">.</span><span class="char c9">.</span>
        </div>
    </div>

    <button id="warning-radar" class="warning-radar" type="button" onclick="toggleWarningModal()" aria-label="Traffic warnings">
        <span id="radar-box" class="radar-box">!</span>
    </button>

    <div id="warning-modal" class="modal fullscreen-modal" aria-hidden="true">
        <div class="modal-shell warning-shell">
            <div class="modal-header">
                <h2>Traffic <span>Warning</span></h2>
                <div class="modal-actions">
                    <span class="tiny-label">Notify</span>
                    <label class="toggle-switch" aria-label="Toggle warning notifications">
                        <input type="checkbox" id="vibrateToggle" checked onchange="saveVibrateState()">
                        <span class="toggle-slider"></span>
                    </label>
                    <button type="button" class="button danger small" onclick="toggleWarningModal()">Close</button>
                </div>
            </div>
            <div id="warning-list" class="warning-list"></div>
        </div>
    </div>

    <main class="app-shell">
        <header class="app-header">
            <div>
                <h1>TRAVEL<span>OS</span></h1>
                <p>Advanced Status Logic</p>
            </div>
            <div class="header-actions">
                <button id="add-place-button" class="button primary hidden" type="button" onclick="openAddPlaceModal()">+ Add Place</button>
                <div id="gps-box" class="gps-box">
                    <span class="gps-pulse"><i></i></span>
                    <span id="gps-coords">System Ready</span>
                </div>
            </div>
        </header>

        <section class="filter-panel">
            <div class="search-block">
                <label for="inputSearch">Data Query</label>
                <input type="text" id="inputSearch" oninput="applyFilters()" placeholder="Tên quán, món ăn, đồ uống...">
            </div>

            <div class="location-grid">
                <div class="field">
                    <label for="selectCountry">Country</label>
                    <select id="selectCountry" onchange="handleCountryChange()">
                        <option value="">Tất cả quốc gia</option>
                    </select>
                </div>
                <div class="field">
                    <label for="selectCity">City</label>
                    <select id="selectCity" onchange="handleCityChange()">
                        <option value="">Tất cả thành phố</option>
                    </select>
                </div>
                <div class="field">
                    <label for="selectArea">Area</label>
                    <select id="selectArea" onchange="applyFilters()">
                        <option value="">Tất cả khu vực</option>
                    </select>
                </div>
            </div>

            <div class="category-block">
                <label>Category Filters</label>
                <div id="category-container" class="category-container"></div>
            </div>
        </section>

        <div id="data-source-banner" class="data-source-banner hidden"></div>
        <div id="results-grid" class="results-grid"></div>
    </main>

    <div id="add-place-modal" class="modal" aria-hidden="true">
        <div class="modal-shell admin-shell">
            <div class="modal-header">
                <div>
                    <h2>Add <span>Place</span></h2>
                    <p>New place will be saved directly to TravelOS D1.</p>
                </div>
                <button type="button" class="button ghost small" onclick="closeAddPlaceModal()">Close</button>
            </div>
            <form id="add-place-form" class="admin-form">
                <div class="form-grid two">
                    <div class="field"><label for="place-name">Tên địa điểm *</label><input id="place-name" name="name" required></div>
                    <div class="field"><label for="place-category">Category</label><input id="place-category" name="category" placeholder="Ăn, Local"></div>
                </div>
                <div class="form-grid three">
                    <div class="field"><label for="place-country">Country</label><input id="place-country" name="country" placeholder="Việt Nam"></div>
                    <div class="field"><label for="place-city">City</label><input id="place-city" name="city" placeholder="Đà Lạt"></div>
                    <div class="field"><label for="place-area">Area</label><input id="place-area" name="area" placeholder="Trung tâm"></div>
                </div>
                <div class="form-grid two">
                    <div class="field"><label for="place-lat">Latitude</label><input id="place-lat" name="latitude" inputmode="decimal"></div>
                    <div class="field"><label for="place-lng">Longitude</label><input id="place-lng" name="longitude" inputmode="decimal"></div>
                </div>
                <div class="field"><label for="place-map">Link chỉ đường</label><input id="place-map" name="map_link" type="url"></div>
                <div class="field"><label for="place-recommend">Recommend / Note</label><textarea id="place-recommend" name="recommend" rows="4"></textarea></div>
                <div class="form-grid three">
                    <div class="field"><label for="place-open1">Giờ mở cửa 1</label><input id="place-open1" name="open_time_1" placeholder="07:00-12:00"></div>
                    <div class="field"><label for="place-open2">Giờ mở cửa 2</label><input id="place-open2" name="open_time_2" placeholder="14:00-22:00"></div>
                    <div class="field"><label for="place-price">Giá/món</label><input id="place-price" name="price"></div>
                </div>
                <div class="form-grid two">
                    <div class="field"><label for="place-ticket">Vé</label><input id="place-ticket" name="ticket"></div>
                    <div class="field"><label for="place-move">Di chuyển</label><input id="place-move" name="move_difficulty" placeholder="Dễ"></div>
                </div>
                <div class="field"><label for="place-road">Lưu ý đường vào</label><textarea id="place-road" name="road_note" rows="3"></textarea></div>
                <div class="field"><label for="place-image">Image URL</label><input id="place-image" name="image_url" type="url"></div>
                <div class="admin-submit-row">
                    <span id="add-place-status" class="form-status"></span>
                    <button id="add-place-submit" type="submit" class="button primary">Save to D1</button>
                </div>
            </form>
        </div>
    </div>

    <script src="bot/keywords.js"></script>
    <script src="bot/prompts.js"></script>
    <script src="config.js"></script>
    <script src="data-service.js"></script>
    <script src="widget.js"></script>
    <script src="chat.js"></script>
    <script src="app.js"></script>
    <script src="ux-image.js"></script>
    <script src="place-manager.js"></script>
    <script src="china-navigation/china-loader.js"></script>
    <script src="nearby-search.js"></script>
</body>
</html>
